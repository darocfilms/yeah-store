<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias — YEAH!</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .thanks-wrap { max-width: 560px; margin: 0 auto; padding: 18vh 24px 10vh; text-align: left; }
  .thanks-check { width: 56px; height: 56px; border-radius: 50%; background: var(--lime); border: 1.5px solid var(--ink); display: grid; place-items: center; font-size: 24px; }
  .thanks-wrap h1 { font-family: var(--font-display); font-size: clamp(38px, 6vw, 58px); line-height: .95; letter-spacing: -.03em; margin: 22px 0 0; text-transform: uppercase; }
  .thanks-wrap p { font-size: 15px; line-height: 1.6; color: var(--muted-1); margin: 16px 0 0; max-width: 46ch; }
  .thanks-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; max-width: 280px; }
  .pending-note { font-family: var(--font-mono); font-size: 11px; color: var(--muted-3); margin-top: 24px; }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <span class="logo-word">YEAH</span>
      <span class="logo-dot"></span>
    </a>
  </div>
</header>

<main class="thanks-wrap">
  <span class="thanks-check">✓</span>
  <h1 id="thanksTitle">Pago<br>recibido</h1>
  <p id="thanksMsg">Estamos confirmando tu pago. En cuanto quede validado, te enviamos el enlace de descarga y la licencia a tu correo.</p>
  <p class="pending-note" id="pendingNote" hidden>Si el pago quedó pendiente de aprobación, el correo de entrega llega apenas se confirme — puede tardar unos minutos.</p>
  <div class="thanks-actions">
    <a href="index.html#tienda" class="btn-outline">Seguir comprando</a>
    <a href="https://wa.me/56943801816" target="_blank" rel="noopener" class="btn-primary-dark">Soporte por WhatsApp</a>
  </div>
</main>

<script>
  try { localStorage.removeItem('yeah_cart'); } catch (e) {}
  var params = new URLSearchParams(window.location.search);
  if (params.get('status') === 'pending') {
    document.getElementById('pendingNote').hidden = false;
    document.getElementById('thanksMsg').textContent = 'Tu pago quedó pendiente de aprobación (por ejemplo, pago en efectivo). Te avisamos por correo apenas se confirme.';
  }
</script>
</body>
</html>
